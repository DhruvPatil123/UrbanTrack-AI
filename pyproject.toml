[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "urbantrack-ai"
version = "1.0.0"
description = "City-Wide AI Engine for Multi-Camera ANPR Trajectory Tracking and Urban Traffic Analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "networkx>=3.1",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "black>=24.0.0"
]
cv = [
    "opencv-python-headless>=4.8.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0"
]
graph = [
    "torch-geometric>=2.5.0",
    "neo4j>=5.18.0",
    "qdrant-client>=1.8.0"
]
