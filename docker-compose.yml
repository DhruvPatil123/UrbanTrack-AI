version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: urbantrack_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://urbantrack:urbantrack_secret@postgres:5432/urbantrack_db
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=urbantrack_secret
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - ENVIRONMENT=production
      - RUNTIME_MODE=auto
    depends_on:
      - postgres
      - redis
      - neo4j
      - qdrant

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: urbantrack_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000/ws/telemetry
    depends_on:
      - backend

  postgres:
    image: postgis/postgis:16-3.4
    container_name: urbantrack_postgres
    environment:
      - POSTGRES_USER=urbantrack
      - POSTGRES_PASSWORD=urbantrack_secret
      - POSTGRES_DB=urbantrack_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: urbantrack_redis
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5.18-community
    container_name: urbantrack_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/urbantrack_secret
    volumes:
      - neo4jdata:/data

  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: urbantrack_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: urbantrack_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  neo4jdata:
  qdrantdata:
  miniodata:
